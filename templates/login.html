{% extends "base.html" %}

{% block title %}Login - SparkleClean{% endblock %}

{% block content %}
<section class="py-5" style="min-height: calc(100vh - 150px); display: flex; align-items: center; background: linear-gradient(135deg, #e7f5ff 0%, #f3f0ff 100%);">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-6 col-xl-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="text-center p-5 pb-3">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-4 mb-4" style="background: linear-gradient(135deg, #4dabf7 0%, #38d9a9 100%); width: 80px; height: 80px;">
                            <i class="bi bi-stars text-white fs-1"></i>
                        </div>
                        <h1 class="fw-bold mb-2">Welcome Back</h1>
                        <p class="text-muted mb-0">Sign in to access your SparkleClean account</p>
                    </div>

                    <div class="card-body px-5 pt-2 pb-5">
                        <form method="POST" action="{{ url_for('login') }}">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-envelope-fill text-muted"></i>
                                    </span>
                                    <input type="email" class="form-control border-start-0" id="email" name="email" required placeholder="john@example.com">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-lock-fill text-muted"></i>
                                    </span>
                                    <input type="password" class="form-control border-start-0" id="password" name="password" required placeholder="Enter your password">
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                                    <label class="form-check-label" for="remember">Remember me</label>
                                </div>
                                <a href="{{ url_for('forgot_password') }}" class="text-decoration-none text-primary fw-semibold small">Forgot password?</a>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill py-3 fw-semibold mb-4">
                                Sign In
                            </button>

                            <div class="text-center">
                                <p class="text-muted mb-0">
                                    Don't have an account?
                                    <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold text-success">
                                        Create Account
                                    </a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">
                        <i class="bi bi-shield-lock me-1"></i>
                        Protected with industry-standard encryption
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
